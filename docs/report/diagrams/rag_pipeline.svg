<svg viewBox="0 0 700 250" width="700" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="700" height="250" fill="#ffffff"/>
    <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
    <g font-size="10.5" fill="#1f2328">
      <rect x="8" y="20" width="110" height="54" rx="8" fill="#f5f7f9" stroke="#d8dee4"/><text x="63" y="43" text-anchor="middle" font-weight="600">Tile + question</text><text x="63" y="58" text-anchor="middle" fill="#59636e" font-size="9.5">from a test set</text>
      <rect x="146" y="20" width="110" height="54" rx="8" fill="#e8f3fa" stroke="#0072B2"/><text x="201" y="43" text-anchor="middle" font-weight="600">Trained model</text><text x="201" y="58" text-anchor="middle" fill="#59636e" font-size="9.5">answer + fused vector</text>
      <rect x="284" y="20" width="160" height="54" rx="8" fill="#eef6f1" stroke="#009E73"/><text x="364" y="40" text-anchor="middle" font-weight="600">Search the index</text><text x="364" y="54" text-anchor="middle" fill="#59636e" font-size="9.5">625,340 training questions,</text><text x="364" y="66" text-anchor="middle" fill="#59636e" font-size="9.5">same type, cosine, top 5</text>
      <rect x="472" y="20" width="110" height="54" rx="8" fill="#eef6f1" stroke="#009E73"/><text x="527" y="40" text-anchor="middle" font-weight="600">5 neighbours</text><text x="527" y="54" text-anchor="middle" fill="#59636e" font-size="9.5">their questions and</text><text x="527" y="66" text-anchor="middle" fill="#59636e" font-size="9.5">true answers</text>
      <rect x="600" y="20" width="92" height="54" rx="8" fill="#fbece5" stroke="#D55E00"/><text x="646" y="43" text-anchor="middle" font-weight="600">Warning rule</text><text x="646" y="58" text-anchor="middle" fill="#59636e" font-size="9.5">do they agree?</text>
      <rect x="284" y="118" width="160" height="54" rx="8" fill="#fdf5e6" stroke="#E69F00"/><text x="364" y="140" text-anchor="middle" font-weight="600">LLM (Groq, free tier)</text><text x="364" y="155" text-anchor="middle" fill="#59636e" font-size="9.5">writes one paragraph</text><text x="364" y="167" text-anchor="middle" fill="#59636e" font-size="9.5">about the neighbours</text>
      <rect x="472" y="118" width="110" height="54" rx="8" fill="#f5f7f9" stroke="#8c959f"/><text x="527" y="140" text-anchor="middle" font-weight="600">Code checks</text><text x="527" y="155" text-anchor="middle" fill="#59636e" font-size="9.5">numbers, claims,</text><text x="527" y="167" text-anchor="middle" fill="#59636e" font-size="9.5">length, warning</text>
      <rect x="600" y="118" width="92" height="54" rx="8" fill="#f5f7f9" stroke="#8c959f"/><text x="646" y="140" text-anchor="middle" font-weight="600">Template</text><text x="646" y="155" text-anchor="middle" fill="#59636e" font-size="9.5">if a check</text><text x="646" y="167" text-anchor="middle" fill="#59636e" font-size="9.5">or the API fails</text>
      <rect x="8" y="118" width="248" height="54" rx="8" fill="#e8f3fa" stroke="#0072B2"/><text x="132" y="140" text-anchor="middle" font-weight="600">Written by code</text><text x="132" y="155" text-anchor="middle" fill="#59636e" font-size="9.5">the answer and confidence, the occlusion</text><text x="132" y="167" text-anchor="middle" fill="#59636e" font-size="9.5">cells, and the no-data strip note</text>
      <rect x="160" y="200" width="380" height="40" rx="8" fill="#fff" stroke="#1f2328"/><text x="350" y="224" text-anchor="middle" font-weight="600">Explanation shown to the user</text>
      <g stroke="#59636e" stroke-width="1.3" fill="none" marker-end="url(#b)">
        <path d="M118 47 H144"/><path d="M256 47 H282"/><path d="M444 47 H470"/><path d="M582 47 H598"/>
        <path d="M646 74 V90 H364 V116"/><path d="M444 145 H470"/><path d="M582 145 H598"/>
        <path d="M201 74 V116"/><path d="M132 172 V198 H158"/><path d="M527 172 V188 H400 V198"/><path d="M646 172 V198 H542"/>
      </g>
      <text x="456" y="84" fill="#59636e" font-size="9">facts (never the true answer)</text>
    </g>
  </svg>
