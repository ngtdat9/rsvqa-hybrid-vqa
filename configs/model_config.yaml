image_size: 256
# classification vocab only — excludes "count" questions, which use the
# separate count_regression head instead. Confirmed empirically from
# data/raw/rsvqa_lr: non-count answers are exactly {yes, no, rural, urban}.
vocab_size: 4
data_dir: data/processed
raw_dir: data/raw/rsvqa_lr
# --- dataset layout (LR); configs/hr_config.yaml holds the HR values ---
split_file_prefix: LR_split            # <prefix>_<split>_questions.json / _answers.json
images_subdir: images/Images_LR        # relative to raw_dir
image_ext: .tif
splits: [train, val, test]
question_types: [comp, rural_urban, presence]   # classification types; count is regressed
area_buckets: null                     # LR has no area questions (HR groups areas into ranges)
norm_stats_max_images: 1000            # cap on train tiles used for mean/std (LR has 572)
max_images_per_split: null             # e.g. {train: 1500, val: 300, test: 300} for a pilot
subset_seed: 0
# max token count in the train split's questions is 26 (verified empirically)
max_question_len: 26
batch_size: 64
num_workers: 0   # set higher (e.g. 4) on a GPU box like Colab, where data loading can bottleneck the GPU

# --- model hyperparameters (first pass; tuned in Week 3) ---
cnn_channels: [32, 64, 128, 128]   # CNN stem channel progression
d_model: 128                        # transformer embedding dim
num_transformer_layers: 2
num_heads: 4
ffn_dim: 256
dropout: 0.1
question_embed_dim: 128             # equal to d_model for simplicity; can diverge in Week 3
fusion_hidden_dim: 256
count_loss_weight: 1.0
# cross_attention = question tokens attend over image patch tokens (default).
# concat          = Week 1 baseline (CLS + mean question vector -> MLP), for the ablation.
fusion_type: cross_attention
# log1p = MSE on log(1 + count) so the count loss doesn't dwarf cross-entropy.
# none  = raw-count MSE (Week 1 baseline behaviour), for the ablation.
count_loss_transform: log1p

# --- training ---
learning_rate: 0.001
epochs: 5
optimizer: adamw
early_stopping_patience: 3
experiments_dir: experiments
experiment_name: week2_crossattn   # train.py appends a timestamp to form the run dir

